name: build-apk
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold native shell, overlay our code
        run: |
          set -e
          flutter create --org com.kisii.church --project-name knlapp \
            --platforms android --android-language java /tmp/tmpl
          ls /tmp/tmpl/android/app/ | head
          cp lib/main.dart /tmp/tmpl/lib/main.dart
          cp pubspec.yaml /tmp/tmpl/pubspec.yaml
          mkdir -p /tmp/tmpl/assets && cp assets/* /tmp/tmpl/assets/
          cp android-shell/AndroidManifest.xml \
            /tmp/tmpl/android/app/src/main/AndroidManifest.xml
          rm -rf /tmp/tmpl/android/app/src/main/res/mipmap-*
          cp -r android-icons/. /tmp/tmpl/android/app/src/main/res/
          rm -rf /tmp/tmpl/test && mkdir -p /tmp/tmpl/test
          cp test/smoke_test.dart /tmp/tmpl/test/
          sed -i 's/minSdk = [0-9][0-9]*/minSdk = 21/; s/minSdkVersion [0-9][0-9]*/minSdkVersion 21/' \
            /tmp/tmpl/android/app/build.gradle.kts /tmp/tmpl/android/app/build.gradle 2>/dev/null || true
          grep -n 'minSdk' /tmp/tmpl/android/app/build.gradle.kts /tmp/tmpl/android/app/build.gradle 2>/dev/null | head -4
          ls /tmp/tmpl/assets | wc -l

      - name: Native release signing (explicit signingConfigs)
        run: |
          set -e
          python3 - <<'EOF'
          import glob
          fs = glob.glob('/tmp/tmpl/android/app/build.gradle*')
          print('gradle files:', fs)
          p = '/tmp/tmpl/android/app/build.gradle.kts' if any(f.endswith('.kts') for f in fs) else '/tmp/tmpl/android/app/build.gradle'
          h = open(p).read()
          if p.endswith('.kts'):
              block = '''    signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
          '''
              assert 'buildTypes' in h, 'no buildTypes in ' + p
              h = h.replace('    buildTypes {', block + '    buildTypes {', 1)
              assert 'getByName("debug")' in h, 'no debug signing ref in ' + p
              h = h.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
          else:
              block = '''    signingConfigs {
                  release {
                      storeFile = file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
          '''
              h = h.replace('    buildTypes {', block + '    buildTypes {', 1)
              h = h.replace('signingConfig = signingConfigs.debug',
                            'signingConfig = signingConfigs.release')
          open(p, 'w').write(h)
          print('signing wired in', p)
          EOF

      - name: Quality gates
        run: |
          cd /tmp/tmpl
          flutter pub get
          flutter analyze
          flutter test

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/tmpl/android/keystore.jks
          echo "keystore bytes: $(wc -c < /tmp/tmpl/android/keystore.jks)"

      - name: Build release APK + AAB
        env:
          KEYSTORE_PATH: /tmp/tmpl/android/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd /tmp/tmpl
          BN=$((50 + $GITHUB_RUN_NUMBER))
          echo "versionCode=$BN"
          flutter build apk --release --build-number=$BN
          flutter build appbundle --release --build-number=$BN

      - name: Verify signatures (gate v1+v2)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          "$APKSIGNER" verify --print-certs \
            /tmp/tmpl/build/app/outputs/flutter-apk/app-release.apk | head -2
          V1=$("$APKSIGNER" verify -v \
            /tmp/tmpl/build/app/outputs/flutter-apk/app-release.apk | grep -i 'v1 scheme')
          V2=$("$APKSIGNER" verify -v \
            /tmp/tmpl/build/app/outputs/flutter-apk/app-release.apk | grep -i 'v2 scheme')
          echo "$V1"; echo "$V2"
          echo "$V1" | grep -q 'true' || { echo 'GATE: v1 missing'; exit 1; }
          echo "$V2" | grep -q 'true' || { echo 'GATE: v2 missing'; exit 1; }
          cp /tmp/tmpl/build/app/outputs/flutter-apk/app-release.apk \
            /tmp/tmpl/knl-flutter-release.apk
          rm -f /tmp/tmpl/android/keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: knl-flutter-apk
          path: /tmp/tmpl/knl-flutter-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: knl-flutter-aab
          path: /tmp/tmpl/build/app/outputs/bundle/release/app-release.aab
